spring.application.name=ai-code-evaluator
# ===============================
# SERVER CONFIG
# ===============================
server.port=7071

# ===============================
# GEMINI API CONFIG
# ===============================
# Replace with your actual Gemini API Key from Google AI Studio (https://aistudio.google.com/)
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
# Base URL (Google Generative AI REST)
gemini.base.url=https://generativelanguage.googleapis.com/v1beta

# ===============================
# IMAGE PROCESSING LIMITS
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# LOGGING (important for debugging AI responses)
# ===============================
logging.level.com.abhishek.ai_code_evaluator=DEBUG
logging.level.org.springframework.web=DEBUG

# ===============================
# TIMEOUT SETTINGS (important for AI calls)
# ===============================
spring.mvc.async.request-timeout=30000